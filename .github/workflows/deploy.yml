name: Deploy to S3 and CloudFront

# The job named `validate` is the check the `main` ruleset requires.
# Rename both together or merges stop.
#
# Every pull request and every push to main runs `validate` (install,
# advisory audit, build, hosting tests, workflow lint). Only main, after
# `validate` passes in the same run, uploads the site and publishes it
# to S3 + CloudFront (`deploy-aws`, infra/ and scripts/deploy-aws.mjs);
# a manual dispatch on main takes the same path. GitHub Pages served the
# site until the DNS moved to CloudFront on 2026-10-27.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # Full history: the sitemap dates each page by its last commit, and the build refuses a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - name: Audit dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - run: npm run build

      - name: Hosting tests
        run: npm test

      - name: Workflow lint
        run: sh scripts/test-workflows.sh

      - if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7

  # Publishes the tested build to S3 behind CloudFront: the files that
  # changed, the redirect map into CloudFront's key value store, the
  # cache cleared, then the result read back through the distribution.
  # The role trusts only this repository's production environment, which
  # only main can deploy to.
  deploy-aws:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: aws-deploy
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3 and CloudFront
        run: npm run deploy:aws
