version: 2
# Dependency updates arrive as pull requests and land through the same
# `validate` check as any other change; vulnerability alerts stay enabled.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # One weekly PR for minor and patch bumps, so they are merged, not ignored.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
